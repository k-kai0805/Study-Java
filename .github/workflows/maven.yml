name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
  # Chay tay tu GitHub Actions UI, khong can day code len main.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache ~/.m2/repository. Khong co dong nay, moi lan chay lai
          # tai toan bo jar tu dau.
          cache: maven

      - name: Build and Test
        # -B = batch mode: log gon cho CI, khong co dong hoi Yes/No.
        run: mvn -B clean verify
